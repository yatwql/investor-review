[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-review"
version = "0.19.1-dev"
description = "投资复盘助手：读取持仓 Excel，生成 Excel/HTML 投资分析报告（含行情、穿透、基金业绩、财经热点关联关联分析与 LLM 深度复盘）"
requires-python = ">=3.11"
dependencies = [
    # 运行时直接依赖：版本约束与 requirements.txt 中同名行**逐字一致**（单源契约，
    # 由 src/test/unit/test_dependency_declarations.py 守卫）；requirements.txt
    # 另含 flask 传递依赖锁定与开发/工具依赖，那些不在此重复声明。
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "h2>=4.2.0",
    "jinja2==3.1.6",
    "akshare>=1.16,<2.0",
    "lxml==6.1.1",
    "flask==3.1.2",
    "pdfplumber>=0.11,<1.0",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
color = [
    "colorama==0.4.6",
]
# SVG 像素审查（make-assets.py svg-pixel|svg-text-overflow）需要；几何审查 svg-geom 免依赖
svg = [
    "Pillow>=10",
]
test = [
    "pytest>=9.1",
    "pytest-mock>=3.15",
    "pytest-xdist>=3.6",
    "pytest-html>=4.2",
    "pytest-timeout>=2.3",
    "pytest-cov>=6.0",
    "ruff==0.15.20",
    "types-colorama",
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
required_plugins = ["pytest-mock>=3.15", "pytest-xdist>=3.6"]

[tool.ruff]
# 与 `requires-python = ">=3.11"` 及 CI 矩阵（3.11/3.12/3.13）对齐：低标会让规则按
# 旧版语义给建议（如可升级语法被拒、可选语法改写方向偏差），与真实运行环境脱节。
target-version = "py311"
line-length = 120
# docs 下为归档快照（含历史脚本副本），冻结不再参与 lint / format
# force-exclude：带上命令行显式路径（如 `ruff format docs`）时仍尊重 exclude。
# 缺这一项时 exclude 只在「整树扫描」生效——显式传目录会把归档脚本一并重排，
# 使历史快照漂移（实测曾误改 7 个 docs/archive 下脚本）。
extend-exclude = [".venv", "docs"]
force-exclude = true

# 行内抑制只对**已启用**的规则生效：`# noqa: X` 里的 X 不在 `select` 内（或该文件被
# per-file-ignores 忽略了 X）时，抑制是空转——由 RUF100（unused-noqa）当硬失败拦住。
# 宽捕获 / 参数注解已成机检项（BLE001 / ANN001），必留的抑制与难注解处一律就地写理由
# （「有意宽捕获：…」/「说明：…」）；异常捕获、未用参数、参数注解的评审口径见
# docs/managements/technical.md §8.7「代码质量口径」。
[tool.ruff.lint]
# 显式声明基线选择项（等价于 ruff 默认集），避免默认集随版本升级静默漂移；
# RUF100 恒开（见上段：抑制必须指向真在跑的规则）
# ARG（未用参数）只约束生产代码——测试域的替身/回调参数天然未用，不属缺陷
# （豁免见下方 per-file-ignores 的 "src/test/**"）。
# 宽捕获（盲 except）按 technical.md §8.7 口径逐处交代，三选一：窄化成具体异常类型
# （覆盖原失败面）、删死捕获（except 体只 pass/return 且该路径不会抛）、或保留宽捕获
# 并在行内写明「宽捕获理由：<为什么必须兜住>」（降级治理壳 / 观测旁路 / 第三方边界 /
# 不得中断主流程）。**不得**用 per-file-ignores 整目录豁免来替代逐处理由。
# 该口径已机检化：`select` 含 `BLE001`，全树零 finding，必留处写 `# noqa: BLE001 — <理由>`
# （规则与抑制同时落地；提前写 noqa 会被 RUF100 判成空转）。
# ANN001（参数缺注解）只约束 `src/python` + `scripts` 生产代码，全树零 finding；
# 测试域已在 per-file-ignores 豁免（fixture/monkeypatch 参数无注解价值，豁免见下方）。
select = ["E4", "E7", "E9", "F", "RUF100", "ARG", "BLE001", "ANN001"]

[tool.ruff.lint.per-file-ignores]
# E402：scripts/ 下入口先注入 sys.path 再导入同目录与项目模块，顺序不可重排
"scripts/*.py" = ["E402"]
# ARG：测试域的替身/回调参数天然未用（mock 与被替身函数须同签名），不属缺陷
# ANN001：测试域 fixture/monkeypatch/替身参数只作占位，注解不提供任何保证
"src/test/**" = ["ARG", "ANN001"]
"src/python/tui/tui.py" = ["E402"]
"src/python/cli/cli.py" = ["E402"]
"src/python/web/server.py" = ["E402"]
"scripts/check-doc-drift.py" = ["E402"]
# E402：子模块 re-export 块置于模块级代码之后（规避循环依赖）
"src/python/llm/generators_orchestrator.py" = ["E402"]
# F821：全仓一律按缺陷报——引号注解引用 TYPE_CHECKING 内的导入时须补
# `if TYPE_CHECKING:` 导入块，不得用按文件豁免掩盖（豁免会让真未定义名静默通过）

[tool.pyright]
# scripts/ 下的评测实现包（_eval_factor_zoo / _eval_decision_quality）在运行期经
# sys.path 注入解析；静态分析需显式声明搜索路径，否则入口脚本的包导入判为未解析。
extraPaths = ["scripts"]

# 类型检查守护（scripts/check-types.py）的规则基线：受检域 = 产品代码 src/python
# + 入口/守护脚本 scripts（两者均为运行期代码，类型错误同样是缺陷）。
# 测试代码刻意不入域：单测天然大量 mock/行内 dict，静态噪音远多于缺陷收益，其正确性
# 由 pytest 运行时守卫（同理不追求 src/test 零告警）。
include = ["src/python", "scripts"]
exclude = ["**/__pycache__", "src/test", "src/static", ".venv", "build", "dist"]
# 测试域刻意不入类型域（正确性由 pytest 运行时守卫）；但编辑器/LSP 打开 src/test 文件时
# 仍会按项目配置解析兄弟模块，对「不改解析语义」的排除目录报「导入无法解析」。把这些
# 文件加入 ignore：只静默诊断，受检域仍是 include 里的 src/python + scripts。
ignore = ["src/test"]
pythonVersion = "3.11"
# 依赖解析走项目虚拟环境（否则 pandas/akshare/flask 等第三方导入判为缺失）
venvPath = "."
venv = ".venv"
