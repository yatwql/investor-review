[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-review"
version = "0.17.5-dev"
description = "投资复盘助手：读取持仓 Excel，生成 Excel/HTML 投资分析报告（含行情、穿透、基金业绩、财经热点关联关联分析与 LLM 深度复盘）"
requires-python = ">=3.11"
dependencies = [
    # 运行时直接依赖：版本约束与 requirements.txt 中同名行**逐字一致**（单源契约，
    # 由 src/test/unit/test_dependency_declarations.py 守卫）；requirements.txt
    # 另含 flask 传递依赖锁定与开发/工具依赖，那些不在此重复声明。
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "h2>=4.2.0",
    "jinja2==3.1.6",
    "akshare>=1.16,<2.0",
    "lxml==6.1.1",
    "flask==3.1.2",
    "pdfplumber>=0.11,<1.0",
]

[project.optional-dependencies]
color = [
    "colorama==0.4.6",
]
# SVG 像素审查（make-assets.py svg-pixel|svg-text-overflow）需要；几何审查 svg-geom 免依赖
svg = [
    "Pillow>=10",
]
test = [
    "pytest>=9.1",
    "pytest-mock>=3.15",
    "pytest-xdist>=3.6",
    "pytest-html>=4.2",
    "ruff==0.15.20",
    "types-colorama",
]

[tool.pytest.ini_options]
testpaths = ["src/test"]
required_plugins = ["pytest-mock>=3.15", "pytest-xdist>=3.6"]

[tool.ruff]
# 与 `requires-python = ">=3.11"` 及 CI 矩阵（3.11/3.12/3.13）对齐：低标会让规则按
# 旧版语义给建议（如可升级语法被拒、可选语法改写方向偏差），与真实运行环境脱节。
target-version = "py311"
line-length = 120
# docs 下为归档快照（含历史脚本副本），冻结不再参与 lint / format
# force-exclude：带上命令行显式路径（如 `ruff format docs`）时仍尊重 exclude。
# 缺这一项时 exclude 只在「整树扫描」生效——显式传目录会把归档脚本一并重排，
# 使历史快照漂移（实测曾误改 7 个 docs/archive 下脚本）。
extend-exclude = [".venv", "docs"]
force-exclude = true

[tool.ruff.lint]
# 显式声明基线选择项（等价于 ruff 默认集），避免默认集随版本升级静默漂移
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402 / F401：scripts/ 下入口先注入 sys.path 再导入同目录与项目模块，顺序不可重排；
# test-runner.py 为「原面 re-export」入口（内部实现已拆到 _test_runner/ 包，为兼容
# 既有测试与调用方而重新导出内部分符号）
"scripts/*.py" = ["E402"]
"scripts/test-runner.py" = ["F401"]
"src/python/tui/tui.py" = ["E402"]
"src/python/cli/cli.py" = ["E402"]
"src/python/web/server.py" = ["E402"]
"scripts/check-doc-drift.py" = ["E402"]
# E402：子模块 re-export 块置于模块级代码之后（规避循环依赖）
"src/python/llm/generators_orchestrator.py" = ["E402"]
# F821：函数内延迟导入 + 引号注解（规避循环依赖）导致的静态误报
"src/python/report/_report_generation.py" = ["F821"]
"src/test/unit/report/test_action_html.py" = ["F821"]
"src/test/unit/report/test_correlation_html.py" = ["F821"]
"src/test/unit/report/test_data_quality_edge.py" = ["F821"]
"src/test/unit/report/test_drawdown_html_excel.py" = ["F821"]
"src/test/unit/report/test_evolution_html.py" = ["F821"]

[tool.pyright]
# scripts/ 下的评测实现包（_eval_factor_zoo / _eval_decision_quality）在运行期经
# sys.path 注入解析；静态分析需显式声明搜索路径，否则入口脚本的包导入判为未解析。
extraPaths = ["scripts"]
