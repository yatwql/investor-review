    <style>
        /* 移动阅读：禁横屏/字号自动放大（iOS text-size-adjust） */
        
        :root {
            /* 页面级主题变量（暗色模式（主题切换）；与 report_template.html 同套，浅色默认值 = 原硬编码色） */

            --fs-table-sm: 12px;

            --lh-tight: 1.3;

            --bg: #f0f2f5;

            --notice-border: #1976D2;
            --empty-section-bg: #fafafa;
            --profit: #CC0000;
            --loss: #007a00;
            --success: #2e7d32;
            --file-card-bg: #f8f9fa;
            --file-card-border: #e3e8ef;
            --file-arrow: #bbb;
            --arrow-up: #2E7D32;
            --arrow-down: #CC0000;
            --arrow-flat: #888;
            --whatif-added-bg: #C6EFCE;
            --whatif-removed-bg: #FFC7CE;
            --whatif-increased-bg: #FFEB9C;
            --whatif-decreased-bg: #DDEBF7;

            --badge-decreased-bg: #d1ecf1;

            --badge-unchanged-bg: #e9ecef;
            --badge-unchanged-text: #6c757d;

            --chart-primary: var(--primary);

            --chart-danger: #CC0000;
            --chart-danger-transparent: rgba(204, 0, 0, 0.15);
            --chart-success: #2E7D32;
            --chart-warning: #E68A00;
            --chart-grid: rgba(128, 128, 128, 0.15);
            --chart-text: #333333;
            --chart-bg: #FFFFFF;
        }
        /* 暗色模式（主题切换）：根元素 data-theme="dark"，theme.js 切换 */
        [data-theme="dark"] {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-2: #252525;
            --text: #e0e0e0;
            --text-secondary: #c0c0c0;
            --text-tertiary: #b0b0b0;
            --text-muted: #9a9a9a;
            --text-faint: #8a8a8a;
            --border: #3a3a3a;
            --border-light: #333333;
            --border-dashed: #444444;

            --table-even: #242424;

            --success: #4caf50;

            --chart-grid: rgba(255, 255, 255, 0.12);

            --chart-danger-transparent: rgba(255, 107, 107, 0.15);

        /* 主题切换按钮（暗色模式（主题切换）；浮动右上角，与主报告一致） */
        
        
        /* ── 打印/导出 PDF 按钮（与主报告同参，主题切换左侧）── */
        
        
        @media print { .theme-toggle-btn { display: none !important; } thead th:first-child, tbody td:first-child { position: static; } }
        @media print { .report-print-btn { display: none !important; } }
        
        
        

        
        
        

        
        
        .section-title { background: var(--primary); color: #fff; padding: 12px 16px; font-size: var(--fs-h3); font-weight: 600; }
        
        
        .back-to-top-link { text-align: center; padding: 12px 0; }
        

        /* ── 文件对比 ───────────────────────────── */
        .compare-files { display: flex; align-items: stretch; gap: 16px; }
        .file-card { flex: 1; background: var(--file-card-bg); border: 1px solid var(--file-card-border); border-radius: 8px; padding: 12px 16px; }
        .file-card .file-role { font-size: var(--fs-table-sm); color: var(--text-muted); margin-bottom: 4px; }
        .file-card .file-name { font-size: var(--fs-h3); font-weight: 600; color: var(--primary); word-break: break-all; }
        .file-arrow { display: flex; align-items: center; font-size: 28px; color: var(--file-arrow); }
        
        .summary-tag strong { color: var(--primary); }

        /* ── 汇总指标卡 ─────────────────────────── */
        
        
        
        
        .summary-card .meta { font-size: var(--fs-table-sm); color: var(--text-faint); margin-top: 4px; }
        .arrow { font-weight: 700; margin-left: 4px; font-size: var(--fs-h3); }
        .arrow-up { color: var(--arrow-up); }
        .arrow-down { color: var(--arrow-down); }
        .arrow-flat { color: var(--arrow-flat); }

        /* ── 资产配置对比图 ─────────────────────── */
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .chart-col .chart-box { position: relative; height: 280px; }
        .chart-caption { font-size: var(--fs-table-sm); color: var(--text-muted); text-align: center; padding: 4px 0 0px; }

        /* ── 表格 ───────────────────────────────── */
        table { width: 100%; border-collapse: collapse; font-size: var(--fs-table); font-variant-numeric: tabular-nums; min-width: 640px; }
        th { background: var(--table-th-bg); padding: 8px 8px; text-align: center; font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
        td { padding: 4px 8px; text-align: center; border-bottom: 1px solid var(--border-light); }
        
        

        /* 宽表首列冻结（窄屏横滚时标签列常显；打印归位） */
        
        
        
        
        
        
        

        /* ── 持仓变动行底色 ─────────────────────── */
        tr.whatif-added td { background: var(--whatif-added-bg); }
        tr.whatif-removed td { background: var(--whatif-removed-bg); }
        tr.whatif-increased td { background: var(--whatif-increased-bg); }
        tr.whatif-decreased td { background: var(--whatif-decreased-bg); }
        tr.whatif-unchanged td { background: var(--whatif-unchanged-bg); }
        tr.whatif-unchanged:hover td { background: var(--table-hover); }
        .action-badge { display: inline-block; padding: 0px 8px; border-radius: 999px; font-size: var(--fs-table-sm); font-weight: 600; }
        .badge-added { background: var(--badge-added-bg); color: var(--badge-added-text); }
        .badge-removed { background: var(--badge-removed-bg); color: var(--badge-removed-text); }
        .badge-increased { background: var(--badge-increased-bg); color: var(--badge-increased-text); }
        .badge-decreased { background: var(--badge-decreased-bg); color: var(--badge-decreased-text); }
        .badge-unchanged { background: var(--badge-unchanged-bg); color: var(--badge-unchanged-text); }

        
        /* 单元级空态/提示（三档空态族之单元级；占位框并入） */
        
        
        
        .chart-export-btn { font-size: var(--fs-footnote); }
        /* ── 触屏档（≤768）：触控目标 ≥44px（DESIGN Responsive 契约）── */
        @media (max-width: 768px) {
            .back-to-top-link a { display: inline-flex; align-items: center; min-height: 44px; }
            .chart-export-btn { min-height: 44px; }
        }
        /* ── 超小屏（≤480）紧凑档 ── */
        @media (max-width: 480px) {
            .report-header h1 { font-size: var(--fs-h3); }
            .section-title { font-size: var(--fs-table); }
            table { font-size: var(--fs-footnote); }
            td, th { padding: 4px 4px; }
            .summary-card .value { font-size: var(--fs-h3); }
        }
    </style>
